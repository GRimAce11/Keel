<svg xmlns="http://www.w3.org/2000/svg" width="840" height="786" viewBox="0 0 840 786" role="img" aria-label="keel generating, extending and inspecting an iOS project">
  <rect width="840" height="786" rx="10" fill="#0d1117"/>
  <rect width="840" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="840" height="10" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="420.0" y="23" fill="#8b949e" font-size="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">keel</text>
  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
    <text><tspan x="22.0" y="58.0" fill="#3fb950">$ </tspan><tspan x="37.1" y="58.0" fill="#f0f6fc">keel new Bookshelf --yes</tspan></text>
    <text><tspan x="22.0" y="100.0" fill="#3fb950">✓</tspan><tspan x="37.1" y="100.0" fill="#8b949e">Wrote 48 files</tspan></text>
    <text><tspan x="22.0" y="121.0" fill="#3fb950">✓</tspan><tspan x="37.1" y="121.0" fill="#8b949e">Bookshelf is ready.</tspan></text>
    <text><tspan x="22.0" y="163.0" fill="#3fb950">$ </tspan><tspan x="37.1" y="163.0" fill="#f0f6fc">keel add feature Library</tspan></text>
    <text><tspan x="22.0" y="205.0" fill="#3fb950">✓</tspan><tspan x="37.1" y="205.0" fill="#8b949e">Added Library to Bookshelf/Features/Library</tspan></text>
    <text><tspan x="22.0" y="247.0" fill="#3fb950">$ </tspan><tspan x="37.1" y="247.0" fill="#f0f6fc">keel inspect</tspan></text>
    <text><tspan x="22.0" y="289.0" fill="#f0f6fc" font-weight="700">Architecture</tspan></text>
    <text><tspan x="37.1" y="310.0" fill="#8b949e">SwiftUI MVVM, organised by feature, wired through a composition</tspan></text>
    <text><tspan x="37.1" y="331.0" fill="#8b949e">root, built on @Observable, async/await and SwiftData.</tspan></text>
    <text><tspan x="37.1" y="373.0" fill="#8b949e">Presentation</tspan><tspan x="157.9" y="373.0" fill="#f0f6fc">MVVM</tspan><tspan x="301.3" y="373.0" fill="#39c5cf">from the code</tspan></text>
    <text><tspan x="157.9" y="394.0" fill="#8b949e">8 SwiftUI views declared.</tspan></text>
    <text><tspan x="157.9" y="415.0" fill="#8b949e">4 types named with a ViewModel suffix.</tspan></text>
    <text><tspan x="157.9" y="436.0" fill="#8b949e">4 of those are @Observable or an ObservableObject.</tspan></text>
    <text><tspan x="37.1" y="457.0" fill="#8b949e">Organisation</tspan><tspan x="157.9" y="457.0" fill="#f0f6fc">Feature-based</tspan><tspan x="301.3" y="457.0" fill="#d29922">from naming</tspan></text>
    <text><tspan x="157.9" y="478.0" fill="#8b949e">3 feature folders found.</tspan></text>
    <text><tspan x="37.1" y="499.0" fill="#8b949e">Feature layers</tspan><tspan x="157.9" y="499.0" fill="#f0f6fc">Consistent</tspan><tspan x="301.3" y="499.0" fill="#d29922">from naming</tspan></text>
    <text><tspan x="157.9" y="520.0" fill="#8b949e">All 3 features are divided into Data, Domain</tspan></text>
    <text><tspan x="157.9" y="541.0" fill="#8b949e">and Presentation.</tspan></text>
    <text><tspan x="37.1" y="562.0" fill="#8b949e">Persistence</tspan><tspan x="157.9" y="562.0" fill="#f0f6fc">SwiftData</tspan><tspan x="301.3" y="562.0" fill="#39c5cf">from the code</tspan></text>
    <text><tspan x="157.9" y="583.0" fill="#8b949e">SwiftData imported by 3 files.</tspan></text>
    <text><tspan x="157.9" y="604.0" fill="#8b949e">1 type marked @Model.</tspan></text>
    <text><tspan x="37.1" y="625.0" fill="#8b949e">Wiring</tspan><tspan x="157.9" y="625.0" fill="#f0f6fc">Composition root</tspan><tspan x="301.3" y="625.0" fill="#d29922">from naming</tspan></text>
    <text><tspan x="157.9" y="646.0" fill="#8b949e">AppContainer declared in App/AppContainer.swift.</tspan></text>
    <text><tspan x="22.0" y="688.0" fill="#3fb950">$ </tspan><tspan x="37.1" y="688.0" fill="#f0f6fc">keel check</tspan></text>
    <text><tspan x="22.0" y="730.0" fill="#3fb950">✓</tspan><tspan x="37.1" y="730.0" fill="#8b949e">Nothing to report.</tspan></text>
    <text><tspan x="37.1" y="751.0" fill="#8b949e">Checked 48 Swift files against 8 rules.</tspan></text>
  </g>
</svg>
