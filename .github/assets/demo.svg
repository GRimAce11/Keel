<svg xmlns="http://www.w3.org/2000/svg" width="915" height="660" viewBox="0 0 915 660" role="img" aria-label="keel inspect --graph and keel check reporting a feature dependency cycle">
  <rect width="915" height="660" rx="10" fill="#0d1117"/>
  <rect width="915" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="915" height="10" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="457.5" y="23" fill="#8b949e" font-size="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">keel</text>
  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="13" xml:space="preserve">
    <text><tspan x="22.0" y="58.0" fill="#3fb950">$ </tspan><tspan x="37.6" y="58.0" fill="#f0f6fc">keel inspect --graph</tspan></text>
    <text><tspan x="22.0" y="100.0" fill="#f0f6fc" font-weight="700">Feature dependencies</tspan></text>
    <text><tspan x="37.6" y="121.0" fill="#8b949e">Articles</tspan></text>
    <text><tspan x="53.2" y="142.0" fill="#8b949e">└── Settings</tspan><tspan x="162.4" y="142.0" fill="#8b949e">1 link</tspan><tspan x="224.8" y="142.0" fill="#8b949e">Demo/Features/Articles/Presentation/ArticleListViewModel.swift:11</tspan></text>
    <text><tspan x="37.6" y="163.0" fill="#8b949e">Settings</tspan></text>
    <text><tspan x="53.2" y="184.0" fill="#8b949e">└── Articles</tspan><tspan x="162.4" y="184.0" fill="#8b949e">1 link</tspan><tspan x="224.8" y="184.0" fill="#8b949e">Demo/Features/Settings/Presentation/SettingsViewModel.swift:11</tspan></text>
    <text><tspan x="22.0" y="226.0" fill="#f0f6fc" font-weight="700">Cycles</tspan></text>
    <text><tspan x="37.6" y="247.0" fill="#8b949e">feature</tspan><tspan x="107.8" y="247.0" fill="#d29922">Articles → Settings → Articles</tspan></text>
    <text><tspan x="22.0" y="289.0" fill="#3fb950">$ </tspan><tspan x="37.6" y="289.0" fill="#f0f6fc">keel check</tspan></text>
    <text><tspan x="22.0" y="331.0" fill="#d29922">!</tspan><tspan x="37.6" y="331.0" fill="#f0f6fc">Demo/Features/Articles/Presentation/ArticleListViewModel.swift:11 — Articles → Settings →</tspan></text>
    <text><tspan x="37.6" y="352.0" fill="#f0f6fc">Articles is a dependency cycle.</tspan></text>
    <text><tspan x="37.6" y="373.0" fill="#8b949e">Neither feature can be understood, moved or extracted without the other. This is the</tspan></text>
    <text><tspan x="37.6" y="394.0" fill="#8b949e">relationship an import graph cannot show: in a single-target app both features compile into</tspan></text>
    <text><tspan x="37.6" y="415.0" fill="#8b949e">the same module, so no import ever crosses between them and nothing else would report it.</tspan></text>
    <text><tspan x="37.6" y="436.0" fill="#8b949e">Path: Articles → Settings → Articles</tspan></text>
    <text><tspan x="37.6" y="457.0" fill="#8b949e">Evidence:</tspan></text>
    <text><tspan x="53.2" y="478.0" fill="#8b949e">Demo/Features/Articles/Presentation/ArticleListViewModel.swift:11</tspan></text>
    <text><tspan x="68.8" y="499.0" fill="#8b949e">Articles → Settings: ArticleListViewModel → SettingsViewModel  property</tspan></text>
    <text><tspan x="53.2" y="520.0" fill="#8b949e">Demo/Features/Settings/Presentation/SettingsViewModel.swift:11</tspan></text>
    <text><tspan x="68.8" y="541.0" fill="#8b949e">Settings → Articles: SettingsViewModel → Article  property</tspan></text>
    <text><tspan x="37.6" y="562.0" fill="#8b949e">[feature-dependency-cycle]</tspan></text>
    <text><tspan x="22.0" y="604.0" fill="#f0f6fc" font-weight="700">Summary</tspan></text>
    <text><tspan x="37.6" y="625.0" fill="#8b949e">0 errors, 1 warning</tspan></text>
  </g>
</svg>
